name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Allow writing to gh-pages and posting PR comments
permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: cd game && npx vite build --base /lee/preview/pr-${{ github.event.number }}/

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: game/dist
          target-folder: preview/pr-${{ github.event.number }}
          branch: gh-pages
          # Don't wipe the whole gh-pages branch on each deploy
          clean: false

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr    = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const url   = `https://${owner}.github.io/${repo}/preview/pr-${pr}/`;

            // Update existing bot comment rather than adding a new one every push
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr,
            });
            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' &&
                   c.body.includes('Preview build')
            );

            const body = `🎮 **Preview build ready!**\n\n**[Open preview →](${url})**\n\n_Updates automatically on each push. You may need to enable GitHub Pages in Settings → Pages (source: \`gh-pages\` branch) if this is your first preview._`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body,
              });
            }
